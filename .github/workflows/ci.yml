name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod
          if [ -f go.sum ]; then
            git diff --exit-code -- go.sum
          fi

      - name: Detect Go packages
        id: go
        run: |
          if [ -n "$(go list ./... 2>/dev/null || true)" ]; then
            echo "packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "packages=false" >> "$GITHUB_OUTPUT"
            echo "No Go packages found; vet/test/lint will be skipped"
          fi

      - name: Vet
        if: steps.go.outputs.packages == 'true'
        run: go vet ./...

      - name: Test
        if: steps.go.outputs.packages == 'true'
        run: go test -race ./...

      - name: Lint
        if: steps.go.outputs.packages == 'true'
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: latest
