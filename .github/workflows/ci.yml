name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod
          if [ -f go.sum ]; then
            git diff --exit-code -- go.sum
          fi

      - name: Vet
        run: |
          pkgs=$(go list ./... 2>/dev/null || true)
          if [ -z "$pkgs" ]; then
            echo "No Go packages found; skipping vet"
            exit 0
          fi
          go vet ./...

      - name: Test
        run: |
          pkgs=$(go list ./... 2>/dev/null || true)
          if [ -z "$pkgs" ]; then
            echo "No Go packages found; skipping tests"
            exit 0
          fi
          go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: latest
